patrol_server:
  ros__parameters:
    linear_speed: 1.0
    angular_speed: 1.0
    heading_gain: 1.5
    waypoint_tolerance: 0.15
    heading_tolerance: 0.10
    control_frequency: 20.0
    feedback_period: 0.2
    pose_timeout: 2.0

patrol_client:
  ros__parameters:
    default_waypoints_x: [2.0, 2.0, 8.0, 8.0]
    default_waypoints_y: [2.0, 8.0, 8.0, 2.0]
    goal_timeout_sec: 0.0
    server_wait_timeout: 10.0
    exit_after_result: true